<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/hojalogo.png" />
  <link rel="apple-touch-icon" href="/hojalogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroData</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registro del Service Worker, forzando que siempre chequee la
         versión más nueva en el servidor (updateViaCache: 'none') y
         pidiéndole al navegador que revise si hay una actualización
         apenas carga la página. Esto evita que un celular se quede
         "pegado" para siempre con una versión vieja y rota del
         Service Worker. -->
    <script>
      // Versión de la app que está corriendo ahora mismo, tomada del
      // nombre real del archivo JS que trajo el navegador (Vite le
      // cambia el nombre —el "hash"— cada vez que el código cambia).
      // Sirve para detectar una versión nueva SIN depender del ciclo de
      // vida del Service Worker, que en un iPhone (PWA instalada en la
      // pantalla de inicio, que iOS solo "pausa" en vez de cerrar) es
      // poco confiable para avisar solo. Esto en cambio es un simple
      // pedido de red, no depende de nada específico de Apple.
      window.__AGRODATA_VERSION_ACTUAL__ =
        document.querySelector('script[type="module"]')?.getAttribute('src') || '';

      async function revisarSiHayVersionNueva() {
        try {
          const respuesta = await fetch('/', { cache: 'no-store' });
          const html = await respuesta.text();
          const match = html.match(/<script[^>]*type="module"[^>]*src="([^"]+)"/);
          const srcNuevo = match ? match[1] : null;
          if (srcNuevo && srcNuevo !== window.__AGRODATA_VERSION_ACTUAL__) {
            window.location.reload();
          }
        } catch (e) {
          // sin conexión: no se puede chequear, se reintenta más tarde
        }
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js', { updateViaCache: 'none' })
            .then((registro) => {
              registro.update();
              if (registro.waiting) {
                registro.waiting.postMessage({ tipo: 'SALTAR_ESPERA' });
              }
              registro.addEventListener('updatefound', () => {
                const nuevoWorker = registro.installing;
                if (!nuevoWorker) return;
                nuevoWorker.addEventListener('statechange', () => {
                  if (nuevoWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    nuevoWorker.postMessage({ tipo: 'SALTAR_ESPERA' });
                  }
                });
              });
            })
            .catch((err) => console.error('Error registrando el Service Worker:', err));

          let yaRecargo = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (yaRecargo) return;
            yaRecargo = true;
            window.location.reload();
          });
        });
      }

      // Cada vez que la app vuelve a primer plano (clave para la PWA en
      // el celular, que queda "pausada" en segundo plano en vez de
      // cerrarse del todo), se revisa si hay una versión nueva
      // comparando el archivo real, sin depender de si el Service
      // Worker se dio cuenta solo.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          revisarSiHayVersionNueva();
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then((registro) => {
              if (registro) registro.update();
            });
          }
        }
      });

      // Respaldo: mientras la app está abierta y a la vista, revisa
      // cada 2 minutos por si se publicó una versión nueva mientras
      // tanto (por ejemplo, si la dejaste al frente todo ese rato).
      setInterval(() => {
        if (document.visibilityState === 'visible') revisarSiHayVersionNueva();
      }, 120000);
    </script>
  </body>
</html>
